[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = false
skip = ["src/archive/**"]
libs = [
    "../../vendor/mynawallet-sc/lib",
    "../../vendor/mynawallet-sc/node_modules"
]
allow_paths = ["../../vendor/mynawallet-sc"]
remappings = [
    "mynawallet/=../../vendor/mynawallet-sc/",
    "src/=../../vendor/mynawallet-sc/src/",
    "@libraries/=../../vendor/mynawallet-sc/src/libraries/",
    "@interfaces/=../../vendor/mynawallet-sc/src/interfaces/",
    "@core/=../../vendor/mynawallet-sc/src/core/",
    "@common/=../../vendor/mynawallet-sc/src/common/",
    "@openzeppelin/contracts-upgradeable/=../../vendor/mynawallet-sc/node_modules/@openzeppelin/contracts-upgradeable/",
    "@openzeppelin/contracts/=../../vendor/mynawallet-sc/node_modules/@openzeppelin/contracts/",
    "@openzeppelin/=../../vendor/mynawallet-sc/node_modules/@openzeppelin/contracts/",
    "@account-abstraction/=../../vendor/mynawallet-sc/node_modules/account-abstraction/contracts/",
    "account-abstraction/=../../vendor/mynawallet-sc/node_modules/account-abstraction/contracts/",
    "erc7579-implementation/=../../vendor/mynawallet-sc/node_modules/erc7579-implementation/",
    "forge-std/=../../vendor/mynawallet-sc/node_modules/forge-std/src/",
    "modular-account/=../../vendor/mynawallet-sc/node_modules/modular-account/src/",
    "openzeppelin-contracts/contracts/=../../vendor/mynawallet-sc/node_modules/@openzeppelin/contracts/",
    "openzeppelin-contracts/=../../vendor/mynawallet-sc/node_modules/@openzeppelin/contracts/",
    "solady/=../../vendor/mynawallet-sc/node_modules/solady/src/",
    "webauthn-sol/=../../vendor/mynawallet-sc/lib/webauthn-sol/src/"
]
