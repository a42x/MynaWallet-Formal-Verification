schemaVersion: 1
target: cross-chain-recovery
additionalSources:
  - id: auth-api
    repository: https://github.com/a42x/api.git
    branch: develop
    commit: 8277832d744c8ce8e2b191fb06f13bff970babfb
    lock: verification/auth-source.lock.json
  - id: gas-sponsor-api
    repository: https://github.com/a42x/api.git
    branch: develop
    commit: dd2b982100960b9dfce9e6f0c02e42a8e450e211
    lock: verification/gas-sponsor-source.lock.json
properties:
  - id: CCR-MODEL-001
    statement: A recovery request executes at most once per chain.
    layer: protocol
    tool: quint-tlc
    status: implemented
  - id: CCR-MODEL-002
    statement: A consumed request corresponds to exactly one successful execution.
    layer: protocol
    tool: quint-tlc
    status: implemented
  - id: CCR-MODEL-003
    statement: If both chains execute the same request, both install the same requested key.
    layer: protocol
    tool: quint-tlc
    status: implemented
  - id: CCR-MODEL-004
    statement: Paused or stale-config chains cannot execute the request.
    layer: protocol
    tool: quint-tlc
    status: implemented
  - id: CCR-KONTROL-001
    statement: The compiled guardian approval hash matches the canonical encoding.
    layer: evm
    tool: kontrol
    status: implemented
  - id: CCR-API-001
    statement: >-
      The fan-out dispatches a UserOp for a chain at most once until the
      attempt is observed lost, and never again after delivery; bounded to
      MaxDispatches=2 attempts per chain.
    layer: api
    tool: quint-tlc
    status: implemented
    bounds: chains=2, requests<=2, ticks<=3, dispatches<=2
  - id: CCR-API-002
    statement: >-
      No UserOp is signed or dispatched for a request whose guardian-approval
      deadline has passed; the dispatch bookkeeping is frozen at deadline
      passage.
    layer: api
    tool: quint-tlc
    status: implemented
    bounds: chains=2, requests<=2, ticks<=3
  - id: CCR-API-003
    statement: >-
      A recovery request that reaches a terminal status (completed, failed,
      expired, cancelled) never leaves that status.
    layer: api
    tool: quint-tlc
    status: implemented
    bounds: chains=2, requests<=2, ticks<=3
  - id: CCR-API-004
    statement: >-
      A second recovery request for the same identity is created only after
      the previous request reached a terminal status and a cooldown window
      elapsed; at most 2 sequential requests per identity.
    layer: api
    tool: quint-tlc
    status: implemented
    bounds: chains=2, requests<=2, ticks<=3
  - id: CCR-API-005
    statement: >-
      The completion notification fires at most once, whichever racing path
      (eager completion check or worker last-chain flip) wins the atomic
      claim.
    layer: api
    tool: quint-tlc
    status: implemented
    bounds: chains=2, requests<=2, ticks<=3
  - id: CCR-REL-001
    statement: >-
      Under partial fan-out (any non-empty subset of chains dispatched, with
      bounded retries), execution is impossible without a prior dispatch,
      only delivered payloads execute, and every executed chain installs
      the same requested key.
    layer: relay
    tool: quint-tlc
    status: implemented
    bounds: chains=2, requests<=2, ticks<=3
  - id: CCR-REL-002
    statement: >-
      A UserOp dispatch occurs only after the Guardian-2 HTTP signature is
      available; no dispatch is made on Guardian-1 signatures alone.
    layer: relay
    tool: quint-tlc
    status: implemented
    bounds: chains=2, requests<=2, ticks<=3
  - id: AUTH-REG-001
    statement: >-
      A passkey registration commits only after its identity's signed eKYC
      session token has been atomically consumed; a pre-commit rollback
      restores only that caller-owned marker.
    layer: api-auth
    tool: quint-tlc
    status: implemented
    bounds: identities=2, registration-requests=2, challenge=1
  - id: AUTH-REG-002
    statement: >-
      At most one passkey registration commits for each identity within the
      bounded registration ceremony.
    layer: api-auth
    tool: quint-tlc
    status: implemented
    bounds: identities=2, registration-requests=2, challenge=1
  - id: AUTH-LOGIN-001
    statement: >-
      An authentication challenge is consumed by at most one accepted verify
      request, including invalid-credential and counter-anomaly outcomes.
    layer: api-auth
    tool: quint-tlc
    status: implemented
    bounds: identities=2, challenges<=2, verify-requests<=3
  - id: AUTH-LOGIN-002
    statement: >-
      A login session is issued only for a registered passkey identity after
      an accepted verification request consumed a generated challenge.
    layer: api-auth
    tool: quint-tlc
    status: implemented
    bounds: identities=2, challenges<=2, verify-requests<=3
  - id: AUTH-LOGIN-003
    statement: >-
      Unknown credentials, invalid WebAuthn assertions and authenticator
      counter anomalies expose the same anonymous login failure class.
    layer: api-auth
    tool: quint-tlc
    status: implemented
    bounds: failure-classes=3
  - id: AUTH-LOGIN-004
    statement: >-
      The login options and verify endpoints each accept at most two requests
      from the modeled IP during their bounded rate-limit window.
    layer: api-auth
    tool: quint-tlc
    status: implemented
    bounds: ip-addresses=1, per-endpoint-limit=2, observed-calls<=3
  - id: AUTH-SESSION-001
    statement: >-
      Refresh-token rotation consumes an active token at most once and
      preserves the authenticated identity on the replacement token pair.
    layer: api-auth
    tool: quint-tlc
    status: implemented
    bounds: identities=2, refresh-tokens=3, access-tokens=3
  - id: AUTH-SESSION-002
    statement: >-
      Logout revokes only a refresh token owned by the authenticated caller;
      a caller cannot revoke another identity's refresh token.
    layer: api-auth
    tool: quint-tlc
    status: implemented
    bounds: identities=2, refresh-tokens=3
  - id: AUTH-SESSION-003
    statement: >-
      Account recovery or deletion revokes every active refresh token for the
      affected identity, and no modeled old refresh token can mint a new pair.
    layer: api-auth
    tool: quint-tlc
    status: implemented
    bounds: identities=2, refresh-tokens=3, access-tokens=3
  - id: AUTH-SESSION-004
    statement: >-
      Every active refresh or access token has exactly one modeled identity
      owner, and refresh rotation never changes that owner.
    layer: api-auth
    tool: quint-tlc
    status: implemented
    bounds: identities=2, refresh-tokens=3, access-tokens=3
  - id: AUTH-SESSION-005
    statement: >-
      A stateless access token is accepted only before its bounded expiry;
      logout and recovery do not extend its lifetime.
    layer: api-auth
    tool: quint-tlc
    status: implemented
    bounds: identities=2, access-tokens=3, access-ttl=2, ticks<=4
  - id: AUTH-REG-CE-001
    statement: >-
      One registration challenge should authorize at most one successful
      registration even when two verify requests race after reading it.
    layer: api-auth
    tool: quint-tlc
    status: counterexample
    result: FAIL
    bounds: identities=2, concurrent-registration-requests=2, challenge=1
  - id: AUTH-SESSION-CE-001
    statement: >-
      Logout or recovery should immediately prevent further use of every
      access token issued before termination.
    layer: api-auth
    tool: quint-tlc
    status: counterexample
    result: FAIL
    bounds: identities=2, access-tokens=3, access-ttl=2, ticks<=4
  - id: GAS-POOL-001
    statement: >-
      Sponsor pool reservation and settlement never reduce the modeled pool balance below zero.
    layer: api-gas-sponsor
    tool: quint-tlc
    source: gas-sponsor-api
    model: GasSponsorPool
    invariant: poolNonnegative
    status: implemented
    bounds: judgments=2, pool=1, initial-funds=3, hold=2, actual={0,1,2,4}, requests<=2/judgment
  - id: GAS-POOL-002
    statement: >-
      Available pool funds plus the net amount deducted for both judgments equal the initial funds, including release and reconciliation outcomes.
    layer: api-gas-sponsor
    tool: quint-tlc
    source: gas-sponsor-api
    model: GasSponsorPool
    invariant: poolConservation
    status: implemented
    bounds: judgments=2, pool=1, initial-funds=3, hold=2, actual={0,1,2,4}, requests<=2/judgment
  - id: GAS-POOL-003
    statement: >-
      Finalize, receipt backfill and the reservation sweeper share an at-most-once pool settlement claim per judgment.
    layer: api-gas-sponsor
    tool: quint-tlc
    source: gas-sponsor-api
    model: GasSponsorPool
    invariant: settlementAtMostOnce
    status: implemented
    bounds: judgments=2, pool=1, initial-funds=3, hold=2, actual={0,1,2,4}, requests<=2/judgment
  - id: GAS-POOL-004
    statement: >-
      An unsettled hold equals its deducted amount; a nonzero settled deduction without a reconciliation flag equals its known receipt cost.
    layer: api-gas-sponsor
    tool: quint-tlc
    source: gas-sponsor-api
    model: GasSponsorPool
    invariant: receiptAccounting
    status: implemented
    bounds: judgments=2, pool=1, initial-funds=3, hold=2, actual={0,1,2,4}, requests<=2/judgment
  - id: GAS-CHARGE-001
    statement: >-
      Gas reservations, refunds and receipt settlement never create a negative balance from the modeled nonnegative starting balance.
    layer: api-gas-sponsor
    tool: quint-tlc
    source: gas-sponsor-api
    model: GasSponsorCharge
    invariant: chargeNonnegative
    status: implemented
    bounds: judgments=2, chains=2, identity=1, shared-balance=3, estimate=2, actual={0,1,2,4}, reserves<=2/judgment
  - id: GAS-CHARGE-002
    statement: >-
      The shared user balance plus pending estimates and confirmed user-paid amounts equal the initial funds.
    layer: api-gas-sponsor
    tool: quint-tlc
    source: gas-sponsor-api
    model: GasSponsorCharge
    invariant: chargeConservation
    status: implemented
    bounds: judgments=2, chains=2, identity=1, shared-balance=3, estimate=2, actual={0,1,2,4}, reserves<=2/judgment
  - id: GAS-CHARGE-003
    statement: >-
      Each committed charge reservation is either pending, refunded once, or normally finalized once; prepare alone consumes no funds.
    layer: api-gas-sponsor
    tool: quint-tlc
    source: gas-sponsor-api
    model: GasSponsorCharge
    invariant: reserveAccounting
    status: implemented
    bounds: judgments=2, chains=2, identity=1, shared-balance=3, estimate=2, actual={0,1,2,4}, reserves<=2/judgment
  - id: GAS-CHARGE-004
    statement: >-
      Each confirmed positive receipt cost equals its user-paid portion plus its explicitly operator-absorbed portion.
    layer: api-gas-sponsor
    tool: quint-tlc
    source: gas-sponsor-api
    model: GasSponsorCharge
    invariant: confirmedCostSplit
    status: implemented
    bounds: judgments=2, chains=2, identity=1, shared-balance=3, estimate=2, actual={0,1,2,4}, reserves<=2/judgment
  - id: GAS-CHARGE-005
    statement: >-
      For one fixed receipt transaction hash per judgment, repeated normal and retroactive settlement confirm at most once.
    layer: api-gas-sponsor
    tool: quint-tlc
    source: gas-sponsor-api
    model: GasSponsorCharge
    invariant: confirmationAtMostOnce
    status: implemented
    bounds: judgments=2, chains=2, identity=1, shared-balance=3, estimate=2, actual={0,1,2,4}, reserves<=2/judgment
  - id: GAS-QUOTA-001
    statement: >-
      Concurrent submits do not exceed the fixed daily limit in any shared or sponsor-scoped user counter.
    layer: api-gas-sponsor
    tool: quint-tlc
    source: gas-sponsor-api
    model: GasSponsorQuota
    invariant: quotaBound
    status: implemented
    bounds: judgments=2, chains=2, identity=1, quota-buckets=3, daily-limit=1, intents=2, day=1
  - id: GAS-QUOTA-002
    statement: >-
      A sponsor judgment claims a user slot at most once, including a submit retry after bundler failure.
    layer: api-gas-sponsor
    tool: quint-tlc
    source: gas-sponsor-api
    model: GasSponsorQuota
    invariant: slotAtMostOnce
    status: implemented
    bounds: judgments=2, chains=2, identity=1, quota-buckets=3, daily-limit=1, intents=2, day=1
  - id: GAS-QUOTA-003
    statement: >-
      Each claimed slot is charged only to its selected shared or sponsor-scoped counter; prepare consumes no slot.
    layer: api-gas-sponsor
    tool: quint-tlc
    source: gas-sponsor-api
    model: GasSponsorQuota
    invariant: scopedAccounting
    status: implemented
    bounds: judgments=2, chains=2, identity=1, quota-buckets=3, daily-limit=1, intents=2, day=1
  - id: GAS-QUOTA-004
    statement: >-
      A fresh slot claim uses the locked sponsor outcome and matching calldata intent, with a resolvable policy at claim time.
    layer: api-gas-sponsor
    tool: quint-tlc
    source: gas-sponsor-api
    model: GasSponsorQuota
    invariant: authorizedClaim
    status: implemented
    bounds: judgments=2, chains=2, identity=1, quota-buckets=3, daily-limit=1, intents=2, day=1
  - id: GAS-POOL-CE-001
    statement: >-
      A repeated positive sponsor decision made before any receipt is known should still be backed by an active pool hold.
    layer: api-gas-sponsor
    tool: quint-tlc
    source: gas-sponsor-api
    model: GasSponsorPool
    invariant: replayBackedByFunds
    status: counterexample
    result: FAIL
    bounds: judgments=2, pool=1, initial-funds=3, hold=2, actual={0,1,2,4}, requests<=2/judgment
  - id: GAS-POOL-CE-002
    statement: >-
      A known receipt, including zero cost received before judgment commit, should leave no unsettled sponsor hold.
    layer: api-gas-sponsor
    tool: quint-tlc
    source: gas-sponsor-api
    model: GasSponsorPool
    invariant: knownReceiptSettled
    status: counterexample
    result: FAIL
    bounds: judgments=2, pool=1, initial-funds=3, hold=2, actual={0,1,2,4}, requests<=2/judgment
  - id: GAS-CHARGE-CE-001
    statement: >-
      Retrying submit concurrently with retroactive debit of a cancelled reserve should leave at most one active spend row for the judgment.
    layer: api-gas-sponsor
    tool: quint-tlc
    source: gas-sponsor-api
    model: GasSponsorCharge
    invariant: oneActiveSpendPerJudgment
    status: counterexample
    result: FAIL
    bounds: judgments=2, chains=2, identity=1, shared-balance=3, estimate=2, actual={0,1,2,4}, reserves<=2/judgment
