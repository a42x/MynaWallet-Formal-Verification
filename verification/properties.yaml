schemaVersion: 1
target: cross-chain-recovery
properties:
  - id: CCR-MODEL-001
    statement: A recovery request executes at most once per chain.
    layer: protocol
    tool: quint-tlc
    status: implemented
  - id: CCR-MODEL-002
    statement: A consumed request corresponds to exactly one successful execution.
    layer: protocol
    tool: quint-tlc
    status: implemented
  - id: CCR-MODEL-003
    statement: If both chains execute the same request, both install the same requested key.
    layer: protocol
    tool: quint-tlc
    status: implemented
  - id: CCR-MODEL-004
    statement: Paused or stale-config chains cannot execute the request.
    layer: protocol
    tool: quint-tlc
    status: implemented
  - id: CCR-KONTROL-001
    statement: The compiled guardian approval hash matches the canonical encoding.
    layer: evm
    tool: kontrol
    status: implemented
  - id: CCR-API-001
    statement: >-
      The fan-out dispatches a UserOp for a chain at most once until the
      attempt is observed lost, and never again after delivery; bounded to
      MaxDispatches=2 attempts per chain.
    layer: api
    tool: quint-tlc
    status: implemented
    bounds: chains=2, requests<=2, ticks<=3, dispatches<=2
  - id: CCR-API-002
    statement: >-
      No UserOp is signed or dispatched for a request whose guardian-approval
      deadline has passed; the dispatch bookkeeping is frozen at deadline
      passage.
    layer: api
    tool: quint-tlc
    status: implemented
    bounds: chains=2, requests<=2, ticks<=3
  - id: CCR-API-003
    statement: >-
      A recovery request that reaches a terminal status (completed, failed,
      expired, cancelled) never leaves that status.
    layer: api
    tool: quint-tlc
    status: implemented
    bounds: chains=2, requests<=2, ticks<=3
  - id: CCR-API-004
    statement: >-
      A second recovery request for the same identity is created only after
      the previous request reached a terminal status and a cooldown window
      elapsed; at most 2 sequential requests per identity.
    layer: api
    tool: quint-tlc
    status: implemented
    bounds: chains=2, requests<=2, ticks<=3
  - id: CCR-API-005
    statement: >-
      The completion notification fires at most once, whichever racing path
      (eager completion check or worker last-chain flip) wins the atomic
      claim.
    layer: api
    tool: quint-tlc
    status: implemented
    bounds: chains=2, requests<=2, ticks<=3
  - id: CCR-REL-001
    statement: >-
      Under partial fan-out (any non-empty subset of chains dispatched, with
      bounded retries), execution is impossible without a prior dispatch,
      only delivered payloads execute, and every executed chain installs
      the same requested key.
    layer: relay
    tool: quint-tlc
    status: implemented
    bounds: chains=2, requests<=2, ticks<=3
  - id: CCR-REL-002
    statement: >-
      A UserOp dispatch occurs only after the Guardian-2 HTTP signature is
      available; no dispatch is made on Guardian-1 signatures alone.
    layer: relay
    tool: quint-tlc
    status: implemented
    bounds: chains=2, requests<=2, ticks<=3
  - id: PAY-KONTROL-001
    statement: >-
      The compiled PaymasterDecision digest matches the canonical EIP-712
      typed-hash encoding for every field value.
    layer: evm
    tool: kontrol
    status: implemented
    bounds: symbolic (userOpHash, validUntil, validAfter, nonce, kid, payerId, policyId); no signature path
  - id: PAY-KONTROL-002
    statement: >-
      validatePaymasterUserOp rejects a decision whose validUntil is in (0,
      now) with PAYMASTER_DECISION_EXPIRED, and a decision whose validAfter
      is in (now, inf) with PAYMASTER_DECISION_NOT_YET_VALID.
    layer: evm
    tool: kontrol
    status: implemented
    bounds: symbolic validUntil / validAfter respectively; all other fields concrete
  - id: PAY-KONTROL-003
    statement: >-
      A decision whose validUntil exceeds the uint48 validationData range
      reverts with PAYMASTER_TIME_WINDOW_OVERFLOW instead of silently
      truncating.
    layer: evm
    tool: kontrol
    status: implemented
    bounds: concrete validUntil = uint48.max + 1
  - id: PAY-KONTROL-004
    statement: >-
      Once a decision validated successfully, no further validation for the
      same (userOpHash, nonce) can succeed: the usage key is marked and any
      repeat, in SPONSOR or USER mode, reverts with PAYMASTER_REPLAY_NONCE.
    layer: evm
    tool: kontrol
    status: implemented
    bounds: concrete bounded run; one successful validation then two rejected repeats
  - id: PAY-KONTROL-005
    statement: >-
      A decision whose kid has no registered signer reverts with
      PAYMASTER_UNKNOWN_SIGNER before any signature evaluation.
    layer: evm
    tool: kontrol
    status: implemented
    bounds: concrete unregistered kid
  - id: PAY-KONTROL-006
    statement: >-
      paymasterAndData parsing gates: a version byte other than 0x01 reverts
      with PAYMASTER_INVALID_VERSION, a mode byte above 1 reverts with
      PAYMASTER_INVALID_MODE, and a data segment shorter than the 2-byte
      header reverts with PAYMASTER_MALFORMED_DATA.
    layer: evm
    tool: kontrol
    status: implemented
    bounds: symbolic version in [0,255] minus {1}, symbolic mode in [2,255]; malformed segment concrete
  - id: PAY-KONTROL-007
    statement: >-
      SPONSOR and USER modes validate identically: both return context
      abi.encode(payerId, policyId, userOpHash) and the same packed
      validationData derived from the decision TTL for a fresh usage key.
    layer: evm
    tool: kontrol
    status: implemented
    bounds: concrete bounded run, two distinct decisions
  - id: PAY-KONTROL-008
    statement: >-
      postOp emits PostOpAudit with (mode, payerId, policyId, userOpHash,
      actualGasCost) decoded exactly from the validation context, and the
      mode labels are opSucceeded, opReverted, postOpReverted.
    layer: evm
    tool: kontrol
    status: implemented
    bounds: concrete bounded runs for opSucceeded and postOpReverted modes
